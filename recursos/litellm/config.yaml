  - model_name: claude-fallback
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"
      drop_params: true
    model_info:
      max_tokens: 8000

  # claude-big: primário trocado de Groq (banido/403) para NVIDIA (ativo)
  - model_name: claude-big
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      drop_params: true
    model_info:
      max_tokens: 8000

  # =====================================================================
  # PROVIDERS COMENTADOS — reativar quando as chaves/rede voltarem.
  # =====================================================================

  # --------- GROQ (403 Cloudflare — IP do host banido) ------------------
  # - model_name: groq-gpt-oss-120b
  #   litellm_params:
  #     model: groq/openai/gpt-oss-120b
  #     api_key: "os.environ/GROQ_API_KEY"
  #     drop_params: true
  # - model_name: groq-llama-3.3-70b
  #   litellm_params:
  #     model: groq/llama-3.3-70b-versatile
  #     api_key: "os.environ/GROQ_API_KEY"
  #     drop_params: true

  # --------- CEREBRAS (403 Cloudflare — IP do host banido) --------------
  # - model_name: cerebras-gpt-oss-120b
  #   litellm_params:
  #     model: cerebras/gpt-oss-120b
  #     api_key: "os.environ/CEREBRAS_API_KEY"
  #     drop_params: true

  # --------- HUGGINGFACE (chave válida, DNS de inference bloqueado) -----
  # - model_name: hf-llama-3.3-70b
  #   litellm_params:
  #     model: huggingface/meta-llama/Llama-3.3-70B-Instruct
  #     api_key: "os.environ/HF_API_KEY"
  #     drop_params: true

litellm_settings:
  drop_params: true
  modify_params: true
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 10
  set_verbose: false
  json_logs: true
  telemetry: false

  # Fallback chains reais — cada alias cai para providers que
  # realmente funcionam hoje, na ordem de prioridade.
  fallbacks:
    - claude-primary: ["gemini-3.1-flash-lite", "openrouter-gemini-3.1-flash-lite", "nvidia-nemotron-super-120b"]
    - claude-fast: ["openrouter-gemini-3.1-flash-lite", "nvidia-nemotron-nano-30b", "nvidia-llama-3.1-8b"]
    - claude-code: ["gemini-3.1-flash-lite", "openrouter-gemini-3.1-flash-lite", "nvidia-nemotron-super-120b", "nvidia-llama-3.3-70b"]
    - claude-code-fast: ["openrouter-gemini-3.1-flash-lite", "nvidia-nemotron-nano-30b", "nvidia-llama-3.1-8b"]
    - claude-fallback: ["openrouter-gemini-3.1-flash-lite", "nvidia-nemotron-nano-30b", "nvidia-llama-3.1-8b"]
    - claude-big: ["sambanova-llama-3.1-405b", "nvidia-nemotron-super-120b-big", "mistral-medium", "gemini-3.1-flash-lite"]

  routing_strategy: "fallback"
  fallback_on_failure: true

  rpm_limit: 1000
  tpm_limit: 500000

  success_callback: []
  failure_callback: []

  log_level: "INFO"

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  ui_access_mode: "admin_only"
  disable_admin_ui: false
  enable_model_groups: true
  enable_cost_tracking: true
  cost_tracking_currency: "USD"
  database_type: "postgresql"
  database_url: "os.environ/DATABASE_URL"
  redis_host: "os.environ/REDIS_HOST"
  redis_port: 6379
  redis_password: "os.environ/REDIS_PASSWORD"
