# =====================================================================
# LiteLLM Proxy — Mapeamento Claude/Anthropic -> Providers gratuitos
# =====================================================================
# DIAGNOSTICO (2026-07-19, corrigido):
#   - NVIDIA NIM ....... FUNCIONA ✅
#   - Gemini (direto) . FUNCIONA ✅
#   - OpenRouter ....... FUNCIONA ✅
#   - SambaNova ........ NOVO — Llama 3.1 405B, adicionado corretamente ✅
#   - HuggingFace ...... DNS bloqueado, comentado ❌
#   - Groq ............. 403 Cloudflare 1010 = IP banido ❌ (comentado)
#   - Cerebras ......... 403 Cloudflare 1010 = IP banido ❌ (comentado)
#   - Mistral .......... 401 (free tier esgotado, deixar como fallback fraco)
#
# CORREÇÃO PRINCIPAL (2026-07-19):
#   Os grupos claude-primary/claude-fast/claude-code/claude-code-fast/
#   claude-fallback/claude-big usavam um `model_list` ANINHADO dentro do
#   próprio entry — isso NÃO é sintaxe válida do LiteLLM e era ignorado
#   silenciosamente. Só existia UM provider real por grupo, sem fallback.
#   Fix: removido o aninhamento; fallback real agora via
#   litellm_settings.fallbacks (nível superior), apontando para modelos
#   que já existem no model_list. claude-big tinha Groq (banido) como
#   primário — trocado para NVIDIA. SambaNova entrou como fallback real.
# =====================================================================

model_list:
  # ===========================================================
  # ALIASES DO CLIENTE (nomes que Zed/Claude Code enviam)
  # ===========================================================
  - model_name: claude-sonnet-5
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"
      max_tokens: 8192
      timeout: 60
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: claude-opus-4-8
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: "os.environ/GEMINI_API_KEY"
      max_tokens: 8192
      timeout: 60
      drop_params: true
    model_info:
      max_tokens: 8000

  # ===========================================================
  # NVIDIA NIM (ATIVO)
  # ===========================================================
  - model_name: nvidia-nemotron-nano-30b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-30b-a3b
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: nvidia-nemotron-super-120b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: nvidia-llama-nemotron-49b
    litellm_params:
      model: nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: nvidia-llama-3.3-70b
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: nvidia-llama-3.1-8b
    litellm_params:
      model: nvidia_nim/nvidia/llama-3.1-nemotron-nano-8b-v1
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: nvidia-nemotron-super-120b-big
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  # ===========================================================
  # GOOGLE GEMINI (ATIVO)
  # ===========================================================
  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: "os.environ/GEMINI_API_KEY"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  # ===========================================================
  # MISTRAL (free tier esgotado — mantido como fallback fraco)
  # ===========================================================
  - model_name: mistral-medium
    litellm_params:
      model: mistral/mistral-medium-2508
      api_key: "os.environ/MISTRAL_API_KEY"
      max_tokens: 8192
      drop_params: true
    model_info:
      max_tokens: 8000

  # ===========================================================
  # SAMBANOVA (NOVO — corrigido: estava preso dentro de um bloco
  # inválido e nunca era registrado como modelo real)
  # ===========================================================
  - model_name: sambanova-llama-3.1-405b
    litellm_params:
      model: sambanova/Meta-Llama-3.1-405B-Instruct
      api_key: "os.environ/SAMBANOVA_API_KEY"
      max_tokens: 8192
      drop_params: true
    model_info:
