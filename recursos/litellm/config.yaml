  - model_name: openrouter-llama-3.3-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
    model_info:
      max_tokens: 8000

  # ===========================================================
  # GRUPOS DE ALIAS — cada um agora tem UM primário real.
  # O fallback de verdade acontece em litellm_settings.fallbacks
  # (abaixo), apontando para model_name's que já existem acima.
  # O `model_list` aninhado que existia aqui foi REMOVIDO por ser
  # sintaxe inválida (não fazia nada).
  # ===========================================================
  - model_name: claude-primary
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: "os.environ/GEMINI_API_KEY"
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: claude-fast
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"
      drop_params: true
