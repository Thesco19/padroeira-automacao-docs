  - model_name: openrouter-qwen2.5-coder
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
    model_info:
      max_tokens: 8000

  - model_name: openrouter-deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
    model_info:
