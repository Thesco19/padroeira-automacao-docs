server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    prefetch: yes
    cache-min-ttl: 60
    cache-max-ttl: 86400

    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # NOTA TÉCNICA HONESTA:
    # Unbound `local-zone: typetransparent` SOZINHO NÃO filtra só AAAA.
    # `always_nodata`/`always_nxdomain` bloqueariam A e AAAA juntos (quebra o streaming).
    # Por isso este Unbound é o resolvedor/forwarder base (rápido, cache local).
    # O filtro AAAA por-domínio de verdade está no CoreDNS ao lado (porta 5353),
    # que retorna NODATA só para AAAA dos domínios de streaming e encaminha o resto.
    # Se quiser filtrar TUDO (exemplo rápido): descomente `filter-aaaa` via dnsmasq, não aqui.

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
