# 99-mtu-tuning.conf — PLPMTUD / mitigação PMTU Black Hole
# Literatura: RFC 4821 (PLPMTUD), RFC 8899 ; tcp_mtu_probing=1 => probing só ao detectar black-hole
# tcp_base_mss default já é 1024 — mantido explícito para auditoria
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024
# Garante PMTUD ativo (não desabilitar discovery):
# net.ipv4.ip_no_pmtu_disc = 0  (padrão, manter 0)
