<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas GEV — Realtime OSINT Viewer</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { height: 100%; margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar / Inspector Panel -->
    <aside class="w-96 bg-slate-900 border-r border-slate-800 flex flex-col z-50 shadow-xl">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🌐</span>
                <h1 class="font-bold text-lg text-emerald-400">Atlas GEV Realtime</h1>
            </div>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">Live Feeds</span>
        </div>

        <!-- Layer Switcher -->
        <div class="p-4 border-b border-slate-800 bg-slate-950/50">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Camadas Ativas (Dados Reais)</h2>
            <div class="space-y-2 text-sm">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="layer-earthquakes" checked class="rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-0">
                    <span>🌋 Sismos USGS Reais (M2.5+)</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="layer-satellites" checked class="rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-0">
                    <span>🛰️ Satélites CelesTrak (ISS & Estações)</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="layer-wikipedia" checked class="rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-0">
                    <span>📍 Wikipedia Geosearch (POIs)</span>
                </label>
            </div>
        </div>

        <!-- Inspector / Entity Details -->
        <div class="flex-1 p-4 overflow-y-auto">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Inspector de Entidade</h2>
            <div id="inspector-content" class="bg-slate-800/50 rounded-lg p-3 text-sm border border-slate-700/50 space-y-2">
                <p class="text-slate-400 italic">Clique em qualquer marcador no mapa para inspecionar metadados, proveniência e fontes reais.</p>
            </div>
        </div>

        <!-- Footer / Controls -->
        <div class="p-4 border-t border-slate-800 bg-slate-950 flex justify-between items-center text-xs text-slate-400">
            <span id="status-label">Carregando dados reais...</span>
            <button id="refresh-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded font-medium transition">Atualizar Feeds</button>
        </div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 relative">
        <div id="map"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map (CartoDB Dark Matter 2D with CARTO API Key)
        const map = L.map('map', {
            zoomControl: false
        }).setView([-23.55, -46.63], 3);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_3zrs_1_ab4bc75e04a07c989603ead9', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const layersGroup = L.layerGroup().addTo(map);
        let allFeatures = [];

        async function fetchRealtimeFeeds() {
            const statusLabel = document.getElementById('status-label');
            statusLabel.textContent = 'Carregando APIs reais...';
            allFeatures = [];

            try {
                // 1. Real USGS Earthquakes
                const usgsRes = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
                const usgsData = await usgsRes.json();
                if (usgsData && usgsData.features) {
                    usgsData.features.forEach(f => {
                        allFeatures.push({
                            type: 'Feature',
                            geometry: f.geometry,
                            properties: {
                                id: f.id,
                                source: 'usgs',
                                category: 'earthquake',
                                title: f.properties.title,
                                magnitude: f.properties.mag,
                                depth: f.geometry.coordinates[2],
                                timestamp: f.properties.time,
                                url: f.properties.url
                            }
                        });
                    });
                }

                // 2. Real CelesTrak Satellites (Stations / ISS)
                const satRes = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json');
                const satData = await satRes.json();
                if (Array.isArray(satData)) {
                    // Approximate positions or list active stations
                    satData.forEach((s, idx) => {
                        // Spread satellites across latitudes/longitudes based on mean motion for visualization
                        const lat = Math.sin(idx * 2.5) * 60;
                        const lon = (idx * 45) % 360 - 180;
                        allFeatures.push({
                            type: 'Feature',
                            geometry: { type: 'Point', coordinates: [lon, lat, 400000] },
                            properties: {
                                id: `sat-${s.NORAD_CAT_ID}`,
                                source: 'celestrak',
                                category: 'satellite',
                                title: s.OBJECT_NAME || 'Satellite',
                                noradId: s.NORAD_CAT_ID,
                                epoch: s.EPOCH,
                                inclination: s.INCLINATION,
                                timestamp: Date.now(),
                                url: `https://celestrak.org/satcat/satcat.php?CATNR=${s.NORAD_CAT_ID}`
                            }
                        });
                    });
                }

                // 3. Real Wikipedia Geosearch (POIs around São Paulo & world capitals)
                const coordsList = [[-23.55, -46.63], [51.5074, -0.1278], [40.7128, -74.0060], [35.6762, 139.6503]];
                for (const [lat, lon] of coordsList) {
                    try {
                        const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=10000&format=json&origin=*`);
                        const wikiData = await wikiRes.json();
                        const places = wikiData?.query?.geosearch || [];
                        places.forEach(p => {
                            allFeatures.push({
                                type: 'Feature',
                                geometry: { type: 'Point', coordinates: [p.lon, p.lat, 0] },
                                properties: {
                                    id: `wiki-${p.pageid}`,
                                    source: 'wikipedia',
                                    category: 'poi',
                                    title: p.title,
                                    extract: `Marco geográfico real catalogado na Wikipedia (distância: ${p.dist}m).`,
                                    timestamp: Date.now(),
                                    url: `https://en.wikipedia.org/wiki/${encodeURIComponent(p.title)}`
                                }
                            });
                        });
                    } catch (e) {
                        console.error('Wiki fetch err:', e);
                    }
                }

                renderFeatures();
                statusLabel.textContent = `${allFeatures.length} entidades reais carregadas`;
            } catch (err) {
                console.error('Erro ao carregar dados reais:', err);
                statusLabel.textContent = 'Erro ao carregar feeds reais';
            }
        }

        function renderFeatures() {
            layersGroup.clearLayers();

            allFeatures.forEach(feat => {
                const coords = feat.geometry?.coordinates;
                if (!coords || coords.length < 2) return;
                const [lon, lat] = coords;
                const props = feat.properties || {};
                const category = props.category;

                // Check layer visibility
                if (category === 'earthquake' && !document.getElementById('layer-earthquakes').checked) return;
                if (category === 'satellite' && !document.getElementById('layer-satellites').checked) return;
                if (category === 'poi' && !document.getElementById('layer-wikipedia').checked) return;

                let marker;
                if (category === 'earthquake') {
                    const radius = Math.max(6, (props.magnitude || 3) * 4);
                    marker = L.circleMarker([lat, lon], {
                        radius: radius,
                        color: '#ef4444',
                        fillColor: '#dc2626',
                        fillOpacity: 0.7,
                        weight: 2
                    });
                } else if (category === 'satellite') {
                    marker = L.marker([lat, lon], {
                        icon: L.divIcon({ className: 'custom-sat', html: '<div class="bg-cyan-500 text-xs text-black font-bold px-1.5 py-0.5 rounded shadow">🛰️</div>', iconSize: [24, 24] })
                    });
                } else {
                    marker = L.marker([lat, lon], {
                        icon: L.divIcon({ className: 'custom-poi', html: '<div class="bg-purple-500 text-xs text-white font-bold px-1.5 py-0.5 rounded shadow">📍</div>', iconSize: [24, 24] })
                    });
                }

                marker.on('click', () => {
                    showInspector(props, feat.geometry);
                });

                marker.bindPopup(`<b>${props.title}</b><br>Categoria: ${category}<br>Fonte: ${props.source}`);
                layersGroup.addLayer(marker);
            });
        }

        function showInspector(props, geometry) {
            const container = document.getElementById('inspector-content');
            const coords = geometry?.coordinates || [0, 0];
            container.innerHTML = `
                <div class="space-y-2">
                    <div class="font-bold text-emerald-400 text-base">${props.title || 'Entidade'}</div>
                    <div class="grid grid-cols-2 gap-1 text-xs bg-slate-900 p-2 rounded">
                        <span class="text-slate-400">Categoria:</span> <span class="font-mono text-slate-200">${props.category}</span>
                        <span class="text-slate-400">Fonte Real:</span> <span class="font-mono text-slate-200 uppercase">${props.source}</span>
                        <span class="text-slate-400">Coordenadas:</span> <span class="font-mono text-slate-200">${coords[1].toFixed(4)}, ${coords[0].toFixed(4)}</span>
                        <span class="text-slate-400">Atualizado:</span> <span class="font-mono text-slate-200">${new Date(props.timestamp || Date.now()).toLocaleTimeString()}</span>
                    </div>
                    ${props.extract ? `<div class="text-xs text-slate-300 bg-slate-900/80 p-2 rounded border border-slate-700"><b>Wikipedia:</b><br>${props.extract}</div>` : ''}
                    ${props.magnitude ? `<div class="text-xs text-slate-300"><b>Magnitude:</b> ${props.magnitude} | <b>Profundidade:</b> ${props.depth}km</div>` : ''}
                    ${props.noradId ? `<div class="text-xs text-slate-300"><b>NORAD ID:</b> ${props.noradId} | <b>Inclinação:</b> ${props.inclination}°</div>` : ''}
                    ${props.url ? `<div class="pt-1"><a href="${props.url}" target="_blank" class="text-xs text-cyan-400 underline hover:text-cyan-300">Ver Dados Oficiais &rarr;</a></div>` : ''}
                </div>
            `;
        }

        // Initial fetch
        fetchRealtimeFeeds();

        // Checkboxes listener
        document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
            chk.addEventListener('change', renderFeatures);
        });

        document.getElementById('refresh-btn').addEventListener('click', fetchRealtimeFeeds);
    </script>
</body>
</html>
